<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234158d0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><path d='M3 9h18'/><path d='m21 9-4.5-3'/><path d='m11 9 4.5-3'/><path d='m3 9 4.5-3'/><path d='m11 3 4.5 3'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Details | Paral·lel Film Festival</title>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main Style -->
    <link id="theme-link" rel="stylesheet" href="/style.css" />
    
    <style>
      body {
        background: var(--bg-dark);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .main-content {
        flex: 1;
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 2rem;
        width: 100%;
      }
      .modal-overlay {
        display: flex !important;
        align-items: center;
        justify-content: center;
        position: fixed;
        z-index: 1000;
        backdrop-filter: blur(20px) saturate(180%);
      }
      .auth-card {
        margin: 0 auto;
      }
      .auth-error {
        background: rgba(239, 68, 68, 0.1);
        color: #ef4444;
        padding: 1rem;
        border-radius: 0.75rem;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        border: 1px solid rgba(239, 68, 68, 0.2);
      }
    </style>
  </head>
  <body>
    <!-- Premium Preloader -->
    <div id="preloader" class="preloader">
      <div class="preloader-content">
        <div class="aperture-spinner">
          <div class="blade"></div><div class="blade"></div><div class="blade"></div>
          <div class="blade"></div><div class="blade"></div><div class="blade"></div>
        </div>
        <div class="loader-text">ESTABLISHING CONNECTION</div>
        <div class="loader-progress"><div class="progress-bar"></div></div>
      </div>
    </div>

    <header>
      <div class="container nav-wrapper">
        <nav>
          <div class="logo" onclick="window.location.href='/'">
            <i data-lucide="clapperboard"></i>
            <span>Paral·lel Film Festival</span>
          </div>
          <div id="userHeader" class="user-actions"></div>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div id="sessionContainer">
        <!-- Details will be injected here -->
      </div>
    </main>

    <!-- AUTH MODAL -->
    <div id="authModal" class="modal-overlay page-hidden">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTabBtn">Sign In</button>
          <button class="auth-tab" id="signupTabBtn" onclick="window.location.href='/?view=auth'">Create Account</button>
        </div>
        
        <div id="authForm" class="auth-form-content">
          <h2>Welcome Back</h2>
          <p>Sign in to view session details.</p>
          
          <div id="authError" class="auth-error page-hidden"></div>

          <button class="google-btn" onclick="window.loginWithGoogle()">
            <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="20" alt="G">
            Continue with Google
          </button>
          
          <div class="divider">or use email</div>
          
          <input type="email" id="authEmail" placeholder="Email Address" required />
          <input type="password" id="authPassword" placeholder="Password" required />
          
          <button class="submit-btn" id="authSubmitBtn" onclick="window.handleStandaloneLogin()">Sign In</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/session_standalone.js"></script>
  </body>
</html>
