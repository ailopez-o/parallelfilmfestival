server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /next-session.html {
        # Dynamic OG tags proxy from Supabase Storage
        resolver 8.8.8.8;
        proxy_ssl_server_name on;
        proxy_set_header Host ljbvamhqpeozkdbgwyzt.supabase.co;
        proxy_pass https://ljbvamhqpeozkdbgwyzt.supabase.co/storage/v1/object/public/social/next-session.html;
        
        # Force Content-Type to HTML
        proxy_hide_header Content-Type;
        add_header Content-Type "text/html; charset=UTF-8";

        # CRITICAL: Hide Supabase Storage security headers that block CSS/JS
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Content-Security-Policy;
        proxy_hide_header Content-Disposition;
        
        proxy_intercept_errors on;
        error_page 404 = /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        try_files /50x.html =404;
    }
}
